name: Rename new homepage to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new version
        run: |
          rm -f index.html
          mv jiu-shou-yu-wen-bang-chan-pin-jie-shao-zhan.html index.html
          git config user.name "thomaswen126"
          git config user.email "thomaswen126@users.noreply.github.com"
          git add -A
          git commit -m "Add Baidu Tongji analytics"
          git push
